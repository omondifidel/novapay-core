name: NovaPay Core CI/CD Engine

# Trigger the pipeline on pushes or pull requests targeting the main branch
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ==========================================================
  # STAGE 1: SOURCE CONTROL AND STATIC ANALYSIS
  # ==========================================================
  source-and-validation:
    name: "Stage 1: Source Control & Validation"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Baseline
        uses: actions/checkout@v4

      - name: Initialize Runtime Environment (Python 3.10)
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Cache Pip Packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install System and Application Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

  # ==========================================================
  # STAGE 2: IMMUTABLE ARTIFACT BUILD & UNIT TESTING
  # ==========================================================
  build-and-test:
    name: "Stage 2: Build & Unit Validation"
    needs: source-and-validation # Enforce sequential dependency gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Baseline
        uses: actions/checkout@v4

      - name: Initialize Runtime Environment (Python 3.10)
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Base Requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Automated Unit Testing Suite
        env:
            # Explicitly tell Python to treat the root workspace directory as a source module root
            PYTHONPATH: ${{ github.workspace }}
        run: |
          # Run pytest pointing explicitly to our structured test module
          pytest src/tests/test_unit.py -v --junitxml=test-results.xml

      - name: Build Secure Multi-Stage Docker Image
        run: |
          # Build local immutable container image tracking version tags
          docker build -t novapay-core:${{ github.sha }} .
          echo "Immutable banking container artifact verified successfully."