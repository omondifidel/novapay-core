name: NovaPay Core CI/CD Engine

# Trigger the pipeline on pushes or pull requests targeting the main branch
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ==========================================================
  # STAGE 1: SOURCE CONTROL AND STATIC ANALYSIS
  # ==========================================================
  source-and-validation:
    name: "Stage 1: Source Control & Validation"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Baseline
        uses: actions/checkout@v4

      - name: Initialize Runtime Environment (Python 3.10)
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Cache Pip Packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install System and Application Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

  # ==========================================================
  # STAGE 2: IMMUTABLE ARTIFACT BUILD & UNIT TESTING
  # ==========================================================
  build-and-test:
    name: "Stage 2: Build & Unit Validation"
    needs: source-and-validation # Enforce sequential dependency gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Baseline
        uses: actions/checkout@v4

      - name: Initialize Runtime Environment (Python 3.10)
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Base Requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Automated Unit Testing Suite
        env:
          PYTHONPATH: ${{ github.workspace }}/src/app  # Ensure tests can import application modules
        run: |
          pytest tests/test_unit.py -v --junitxml=test-results.xml

      - name: Build Secure Multi-Stage Docker Image
        run: |
          docker build -t novapay-core:${{ github.sha }} .
          echo "Immutable banking container artifact verified successfully."

  # ==========================================================
  # SPRINT 2: STAGE 3 & 4 - SECURITY SHIELD & VULNERABILITY GATES
  # ==========================================================
  security-shield:
    name: "Stage 3 & 4: SAST & Supply Chain Security"
    needs: build-and-test # Block security evaluation if core unit tests fail
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Baseline
        uses: actions/checkout@v4

      - name: Initialize Runtime Environment (Python 3.10)
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Bandit Security Scanner
        run: |
          python -m pip install --upgrade pip
          pip install bandit

      - name: "Execute Stage 3: SAST Analysis (Code Security Scan)"
        run: |
          # Scan the src/app/ folder. High-severity issues break the pipeline (-ll flag)
          bandit -r src/app/ -ll -v

      - name: "Execute Stage 4: Dependency Vulnerability Scan (Trivy)"
        run: |
          # 1. Add AquaSecurity signature keys and repository definitions to apt
          sudo apt-get update && sudo apt-get install -y wget apt-transport-https gnupg lsb-release
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | sudo tee /etc/apt/sources.list.d/trivy.list
          
          # 2. Update package list and install the verified stable native CLI binary
          sudo apt-get update && sudo apt-get install -y trivy
          
          # 3. Run the security scan. Fails with code 1 if unpatched CRITICAL issues are found
          trivy fs --exit-code 1 --ignore-unfixed --severity CRITICAL .