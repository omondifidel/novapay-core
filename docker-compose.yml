version: '3.8'

services:
  # Slot A: The Blue Environment
  novapay-blue:
    build: .
    container_name: novapay-core-blue
    environment:
      - DATABASE_URL=sqlite:///novapay_prod.db
    ports:
      - "8001:8000"
    restart: always

  # Slot B: The Green Environment
  novapay-green:
    build: .
    container_name: novapay-core-green
    environment:
      - DATABASE_URL=sqlite:///novapay_prod.db
    ports:
      - "8002:8000"
    restart: always

  # The Master Traffic Switchboard
  novapay-proxy:
    image: nginx:alpine
    container_name: novapay-traffic-router
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - novapay-blue
      - novapay-green
    restart: always