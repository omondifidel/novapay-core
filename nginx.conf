events { worker_connections 1024; }

http {
    # Define the upstream server targets for NovaPay Core
    # Blue runs on port 8001, Green runs on port 8002
    upstream novapay_backend {
        # By default, we point to our stable Blue environment
        server novapay-blue:8000;
        
        # The deployment script will dynamically toggle this target
        # server novapay-green:8000;
    }

    server {
        listen 80;
        server_name localhost;

        # Forward all incoming traffic to the active upstream cluster
        location / {
            proxy_pass http://novapay_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_redirect off;
        }
    }
}